name: Deploy

# Runs after CI succeeds on main, so a broken build never reaches the server.
on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

jobs:
  build-and-push:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/veles-backend:latest
            ghcr.io/${{ github.repository_owner }}/veles-backend:${{ github.sha }}

      - uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_YANDEX_MAPS_API_KEY=${{ secrets.VITE_YANDEX_MAPS_API_KEY }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/veles-frontend:latest
            ghcr.io/${{ github.repository_owner }}/veles-frontend:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      # NOTE: this job cannot succeed yet -- DEPLOY_HOST/DEPLOY_USER/
      # DEPLOY_SSH_KEY/DEPLOY_PATH don't exist until a real server is
      # provisioned. Written now per the plan, enabled once those secrets
      # are filled in under the GitHub "production" Environment.
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            cat > .env <<EOF
            DEBUG=False
            SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}
            DJANGO_SETTINGS_MODULE=veles.settings.prod
            DATABASE_URL=sqlite:////app/data/db.sqlite3
            ALLOWED_HOSTS=${{ secrets.DJANGO_ALLOWED_HOSTS }}
            CORS_ALLOWED_ORIGINS=${{ secrets.CORS_ALLOWED_ORIGINS }}
            VITE_YANDEX_MAPS_API_KEY=${{ secrets.VITE_YANDEX_MAPS_API_KEY }}
            EOF
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f

# Required secrets under the GitHub "production" Environment:
#   DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_PATH, DEPLOY_PORT (optional, default 22)
#   DJANGO_SECRET_KEY, DJANGO_ALLOWED_HOSTS, CORS_ALLOWED_ORIGINS
#   VITE_YANDEX_MAPS_API_KEY
# DEPLOY_* are not available yet -- no server has been provisioned. This
# workflow will simply fail at the deploy job until they're added; the CI
# workflow and image build/push are independently useful today.
