name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # matches backend/Dockerfile's base image
      - run: pip install -r requirements.txt -r requirements-dev.txt
      # No .env needed: veles.settings.dev (used by pytest.ini) has safe
      # built-in defaults (SECRET_KEY, sqlite) for exactly this reason.
      - run: pytest -q
      - run: python manage.py makemigrations --check --dry-run

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test
      - run: npm run lint
      # Full Playwright e2e deliberately not run here yet -- needs a live
      # backend + seeded data in the runner, more than this project needs
      # for now. tests/e2e/smoke.spec.ts stays a local/Playwright-MCP gate.
